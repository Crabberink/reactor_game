[package]
name = "reactor_game"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = { version = "0.7.0", features = ["parallel", "serialize", "simd"] }
bevy = { version = "0.19.1", features = ["dynamic_linking", "trace_tracy", "debug"] }
bevy_common_assets = { version = "0.17.0", features = ["ron"] }
bevy_dylib = "0.19.1"
bevy_replicon = "0.41.1"
leafwing-input-manager = "0.21.0"
rand = "0.10.2"
ron = "0.12.2"
serde = "1.0.229"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.20"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
