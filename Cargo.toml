[package]
name = "reactor_game"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = { version = "0.8.0", features = ["parallel", "serialize"] }
bevy = { version = "0.20.1", features = ["dynamic_linking", "debug"] }
bevy-inspector-egui = "0.38.0"
bevy_common_assets = { version = "0.18.0", features = ["ron"] }
bevy_dylib = "0.20.1"
bevy_replicon = "0.45.5"
clap = { version = "4.6.7", features = ["cargo", "derive"] }
leafwing-input-manager = "0.22.0"
lightyear = { version = "0.31.0", features = ["avian3d", "leafwing", "netcode", "udp"] }
rand = "0.10.3"
ron = "0.12.3"
serde = "1.0.229"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.21"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
